[project]
name = "pointmlp-pytorch"
version = "0.1.0"
description = "PointMLP ModelNet40 training and BUPT ML course prediction utilities"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "cycler>=0.10",
    "einops>=0.3",
    "h5py>=3.2",
    "huggingface-hub>=0.23",
    "matplotlib>=3.4",
    "numpy>=1.23,<2.0",
    "pyyaml>=5.4",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "torch>=2.1,<2.6",
    "torchvision>=0.16,<0.21",
    "tqdm>=4.61",
]
